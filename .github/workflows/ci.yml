# Pasitos · CI de cada PR (T-001 §5, T-006).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tests, build y peso
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - name: Formato y estilos
        run: pnpm format:check && pnpm lint:css

      - name: Lint, tests y build (proyectos afectados)
        # Los tests de la base usan Testcontainers: el runner de GitHub ya trae Docker.
        run: pnpm exec nx affected -t lint test build --exclude=contrato-evento

      - name: Peso comprimido de cada app
        run: pnpm exec nx run-many -t build -p app sala mesa admin plataforma sitio && node tools/peso.mjs

      - name: Auditoría de dependencias
        run: pnpm audit --audit-level high

  contrato:
    name: Contrato Soroban
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Vectores de huellas al día (los mismos que prueba libs/firmas)
        working-directory: .
        run: python3 tools/vectores/generar.py --comprobar
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Stellar CLI (queda en la caché de ~/.cargo/bin)
        run: cargo install --locked stellar-cli@30.0.1
      - name: WASM y su tamaño
        run: |
          stellar contract build
          tamano=$(stat -c %s target/wasm32v1-none/release/pasitos_evento.wasm)
          echo "WASM: $tamano bytes"
          if [ "$tamano" -gt 65536 ]; then
            echo "::error::El WASM del contrato pasa de 64 KB ($tamano bytes)"
            exit 1
          fi

  sellador-red-local:
    name: Sellador con red local
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Stellar CLI (queda en la caché de ~/.cargo/bin)
        run: cargo install --locked stellar-cli@30.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Red local de Stellar
        run: |
          docker compose -f infra/compose.dev.yml --profile stellar up -d --wait stellar
      - name: Cuentas y WASM en la red local
        run: |
          stellar keys generate ci-operador --network local --fund
          stellar keys generate ci-admin --network local --fund
          (cd contracts && stellar contract build)
          hash=$(stellar contract upload --wasm contracts/target/wasm32v1-none/release/pasitos_evento.wasm --source ci-operador --network local)
          stellar keys show ci-operador > "$RUNNER_TEMP/operador.key"
          chmod 600 "$RUNNER_TEMP/operador.key"
          {
            echo "STELLAR_PRUEBAS_RPC_URL=http://127.0.0.1:8000/rpc"
            echo "STELLAR_PRUEBAS_LLAVE_ARCHIVO=$RUNNER_TEMP/operador.key"
            echo "STELLAR_PRUEBAS_ADMIN=$(stellar keys address ci-admin)"
            echo "STELLAR_PRUEBAS_WASM_HASH=$hash"
          } >> "$GITHUB_ENV"
      - name: Sellador contra la red local
        run: pnpm exec vitest run --config apps/trabajador/vitest.config.mts red-local

  secretos:
    name: Revisión de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
