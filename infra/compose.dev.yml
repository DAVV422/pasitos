# Pasitos · servicios para desarrollo local.
# Uso: docker compose -f infra/compose.dev.yml --env-file .env up -d
name: pasitos-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PASITOS_OWNER_PASSWORD: ${PASITOS_OWNER_PASSWORD}
      PASITOS_APP_PASSWORD: ${PASITOS_APP_PASSWORD}
      PASITOS_SISTEMA_PASSWORD: ${PASITOS_SISTEMA_PASSWORD}
      PASITOS_COPIAS_PASSWORD: ${PASITOS_COPIAS_PASSWORD}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=200
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/inicio.sh:/docker-entrypoint-initdb.d/inicio.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pasitos']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres:
