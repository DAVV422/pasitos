# Pasitos · servicios para desarrollo local.
# Uso: docker compose -f infra/compose.dev.yml --env-file .env up -d
name: pasitos-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PASITOS_OWNER_PASSWORD: ${PASITOS_OWNER_PASSWORD}
      PASITOS_APP_PASSWORD: ${PASITOS_APP_PASSWORD}
      PASITOS_SISTEMA_PASSWORD: ${PASITOS_SISTEMA_PASSWORD}
      PASITOS_COPIAS_PASSWORD: ${PASITOS_COPIAS_PASSWORD}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=200
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/inicio.sh:/docker-entrypoint-initdb.d/inicio.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pasitos']
      interval: 5s
      timeout: 3s
      retries: 20

  # Buzón de correo de desarrollo (T-007a): el trabajador le manda todo por SMTP y nada sale de la
  # computadora. Ver los correos: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_MAX_MESSAGES: '2000'
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  # Red local de Stellar (HU-102): core, RPC y Friendbot. Solo con el perfil `stellar`:
  #   pnpm stellar:levantar · pnpm stellar:bajar
  # Imagen fija por digest (2026-11-14); se actualiza a mano junto con Stellar CLI.
  stellar:
    profiles: ['stellar']
    image: stellar/quickstart@sha256:a61ce821add98adb4f3e3d6e757b2615dd169a2b39c7e30cd47cfa95074f97d9
    command: ['--local', '--enable', 'core,rpc', '--limits', 'unlimited']
    ports:
      - '127.0.0.1:${STELLAR_PORT:-8000}:8000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf -X POST -H "Content-Type: application/json" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}" http://localhost:8000/rpc | grep -q healthy',
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  postgres:
