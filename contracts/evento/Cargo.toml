[package]
name = "pasitos-evento"
version = "0.1.0"
edition = "2021"
publish = false
description = "Contrato del evento de Pasitos (HU-102)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
